[project]
name = "vilu-corpus"
version = "0.1.0"
description = "Reproducible, license-aware ophthalmology corpus pipeline for ViLu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.6,<5",
  "pyarrow>=18,<22",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
vilu-corpus = "vilu_corpus.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vilu_corpus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["vilu_corpus"]
