name: Offer Finder ingestion

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source_id:
        description: "Approved offer_sources.id (blank runs fixture canary only)"
        required: false
        type: string
      market:
        description: "Optional approved market shard"
        required: false
        type: string
      dry_run:
        description: "Do not write production data"
        required: true
        default: true
        type: boolean
      canary:
        description: "Run the explicitly approved read-only canary"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: offer-finder-${{ inputs.source_id || (github.event_name == 'schedule' && '00000000-0000-4000-8000-000000000068') || 'fixture-canary' }}
  cancel-in-progress: false

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security and adapter contract tests
        run: >-
          npx vitest run
          scripts/offer-finder/ingestion.test.ts
          scripts/offer-finder/operations.test.ts
          scripts/offer-finder/normalization.test.ts
          scripts/offer-finder/normalization-runner.test.ts
      - name: Fixture-only canary
        run: node --experimental-strip-types scripts/offer-finder/canary.ts --dry-run

  approved-live-canary:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canary && !inputs.dry_run && inputs.source_id != '') }}
    needs: fixture-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: offer-finder-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select the single approved source
        shell: bash
        env:
          MANUAL_SOURCE_ID: ${{ inputs.source_id }}
          # The only scheduled production source is the owner-authorized,
          # exactly-one-offer ViLu feed. Keep manual runs explicitly scoped.
          SCHEDULED_SOURCE_ID: ${{ github.event_name == 'schedule' && '00000000-0000-4000-8000-000000000068' || '' }}
        run: echo "OFFER_FINDER_SOURCE_ID=${MANUAL_SOURCE_ID:-${SCHEDULED_SOURCE_ID}}" >> "$GITHUB_ENV"
      - name: Run bounded canary, normalization and health checks
        env:
          OFFER_FINDER_SUPABASE_URL: ${{ secrets.OFFER_FINDER_SUPABASE_URL }}
          OFFER_FINDER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OFFER_FINDER_SUPABASE_SERVICE_ROLE_KEY }}
          OFFER_FINDER_CANARY_URL: ${{ secrets.OFFER_FINDER_CANARY_URL }}
        run: node --experimental-strip-types scripts/offer-finder/operations.ts
