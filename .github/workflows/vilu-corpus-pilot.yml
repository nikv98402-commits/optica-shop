name: ViLu corpus bounded pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vilu-corpus-bounded-pilot
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and build 1,000-record pilot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/vilu-corpus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify lockfile integrity
        run: |
          python - <<'PY'
          from pathlib import Path

          lockfile = Path("uv.lock")
          lockfile.read_text(encoding="utf-8", errors="strict")
          PY
          sha256sum --check uv.lock.sha256

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/vilu-corpus/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run corpus tests
        run: uv run pytest

      - name: Probe pinned source schema
        run: uv run vilu-corpus probe

      - name: Build bounded pilot
        id: build
        timeout-minutes: 75
        run: >-
          uv run vilu-corpus build
          --limit 1000
          --scan-limit 100000
          --output runs/pilot-1000

      - name: Upload bounded selection checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vilu-corpus-checkpoint-${{ github.run_id }}
          path: tools/vilu-corpus/runs/pilot-1000/checkpoint.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Validate bounded pilot
        id: validate
        run: >-
          uv run vilu-corpus validate
          --output runs/pilot-1000
          --min-candidates 1000
          --min-accepted 100

      - name: Print aggregate report
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: uv run vilu-corpus report --output runs/pilot-1000

      - name: Upload protected corpus artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: vilu-corpus-pilot-${{ github.run_id }}
          path: |
            tools/vilu-corpus/runs/pilot-1000/
            !tools/vilu-corpus/runs/pilot-1000/checkpoint.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
