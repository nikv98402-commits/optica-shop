name: Process employee data deletions

permissions: {}

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: employee-data-deletion-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch queued deletion requests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DATA_DELETION_DISPATCH_SECRET: ${{ secrets.DATA_DELETION_DISPATCH_SECRET }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$DATA_DELETION_DISPATCH_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/process-data-deletion" \
            --header "Authorization: Bearer $DATA_DELETION_DISPATCH_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"batchSize":25}'
